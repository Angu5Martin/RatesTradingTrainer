[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rates-trainer"
version = "0.1.0"
description = "Interactive EUR linear-rates trading trainer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
rates-trainer = "rates_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rates_trainer = ["curriculum/curated/*.toml", "mmgame/data/*.toml", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
