# The curated world-knowledge bank for the market-making game.
# Each item is a number with an explicit resolution rule. 'answer' settles the market; 'lo'/'hi' is the public settlement range; 'spread' is the typical error of an
# informed guess (it sizes the crowd's uncertainty and the lot value, and is never shown); 'tick' is the quote increment; 'as_of' dates the fact. An optional [item.alt]
# is a *resolution change* of the same family (a different date, scope or stage) used by the resolution shock. 'source' names the reference; sources are shown only after resolution.
# 'added' is the bank version that introduced an item (absent = 1). A game is dealt from one bank version and remembers it, so growing the bank never changes a saved game: append new items, never reorder or edit old ones.

